spring:
  application:
    name: BulletinBoard

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  expiration: 3600000
  secret: nStPlulbKgo1O5GHtsDxjWU1GTRnE3GcrAs3voaKDeG

logging:
  level:
    root: INFO
    com.bulletinboard: DEBUG
    org.springframework: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG