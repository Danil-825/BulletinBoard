spring:
  application:
    name: BulletinBoard

  datasource:
    url: jdbc:postgresql://localhost:5432/bulletin_board
    username: postgres
    password: 54321
    hikari:
      connection-timeout: 30000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

# Swagger
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

# JWT
jwt:
  expiration: 3600000
  secret: nStPlulbKgo1O5GHtsDxjWU1GTRnE3GcrAs3voaKDeG

# Логи
logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework: DEBUG
    org.springframework.security: WARN
    org.springframework.cloud.openfeign: DEBUG
